<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaarigar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2B2420;
    --clay:#AE5A38;
    --clay-light:#C97B54;
    --sage:#707C57;
    --sage-light:#95A278;
    --bg:#EBE3D0;
    --bone:#F6F1E4;
    --paper:#FBF8F1;
    --brass:#A9843F;
    --line: rgba(43,36,32,0.14);
    --shadow: 0 18px 40px rgba(43,36,32,0.14);
    --ease: cubic-bezier(.22,.68,.32,1);
  }
  
*{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-size:16px;
    line-height:1.55;
    overflow-x:hidden;
  }
